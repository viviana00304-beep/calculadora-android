name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git zlib1g-dev openjdk-17-jdk unzip wget curl \
          autoconf libtool pkg-config patch libltdl-dev

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

- name: Accept Android SDK Licenses
        run: |
          mkdir -p $HOME/.android
          echo "2d6c35398a85590924765d75cbcd12668e1ab5c0" > $HOME/.android/repositories.cfg
    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
